name: AIKanji
options:
  bundleIdPrefix: com.aikanji
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
targets:
  AIKanji:
    type: application
    platform: iOS
    sources:
      - AIKanji
    info:
      path: AIKanji/Info.plist
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aikanji.AIKanji
        INFOPLIST_FILE: AIKanji/Info.plist
        SWIFT_VERSION: "5.9"
