name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno lint supabase/functions
        working-directory: AIKanji
      - run: deno fmt --check supabase/functions
        working-directory: AIKanji
      - run: deno check supabase/functions/llm-assist/index.ts supabase/functions/restaurant-search/index.ts supabase/functions/place-search/index.ts
        working-directory: AIKanji

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Migrations, seed and RPC/RLS tests
        run: AIKanji/supabase/tests/run.sh

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Asserts the TypeScript engine port still agrees with the SQL engine on the
      # seeded fixture (0 feasible, then 3 after the room MUST relaxes).
      - run: npm run verify:engine
      - run: npm run build

  ios-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build for the iOS Simulator
        run: |
          xcodebuild build \
            -project AIKanji/AIKanji.xcodeproj \
            -scheme AIKanji \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO
