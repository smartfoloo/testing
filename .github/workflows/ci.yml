name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno lint supabase/functions
        working-directory: AIKanji
      - run: deno fmt --check supabase/functions
        working-directory: AIKanji
      - run: deno check supabase/functions/llm-assist/index.ts supabase/functions/restaurant-search/index.ts
        working-directory: AIKanji

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Migrations, seed and RPC/RLS tests
        run: AIKanji/supabase/tests/run.sh

  ios-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build for the iOS Simulator
        run: |
          xcodebuild build \
            -project AIKanji/AIKanji.xcodeproj \
            -scheme AIKanji \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO
