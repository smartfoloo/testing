name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  config-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify generated client configuration with placeholders
        run: |
          node --check scripts/sync-local-secrets.mjs
          printf '%s\n' \
            'SUPABASE_URL=https://example.invalid' \
            'SUPABASE_ANON_KEY=ci-publishable-placeholder' \
            'INVITE_LINK_BASE_URL=https://invite.example.invalid' \
            'SUPABASE_SERVICE_ROLE_KEY=ci-server-only-placeholder' \
            'LLM_API_KEY=ci-server-only-placeholder' \
            'AIKANJI_TEST_PASSWORD=ci-server-only-placeholder' \
            > .env
          node scripts/sync-local-secrets.mjs
          node scripts/sync-local-secrets.mjs --check
          if grep -Fq 'ci-server-only-placeholder' AIKanji/Secrets.xcconfig web/.env.local; then
            echo 'server-only placeholder reached a client output' >&2
            exit 1
          fi

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno lint supabase/functions
        working-directory: AIKanji
      - run: deno fmt --check supabase/functions
        working-directory: AIKanji
      - run: deno check supabase/functions/llm-assist/index.ts supabase/functions/restaurant-search/index.ts supabase/functions/place-search/index.ts
        working-directory: AIKanji

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Migrations, seed and RPC/RLS tests
        run: AIKanji/supabase/tests/run.sh

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Asserts the TypeScript engine port still agrees with the SQL engine on the
      # seeded fixture (0 feasible, then 3 after the room MUST relaxes).
      - run: npm run verify:engine
      - run: npm run build

  ios-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # A generic destination, not a named device: the job only compiles, and pinning a
      # concrete simulator makes it hostage to which runtimes the runner image happens to
      # ship — 'iPhone 16' vanished from macos-15 mid-day and the build failed at
      # destination resolution without ever reaching the compiler.
      - name: Build for the iOS Simulator
        run: |
          xcodebuild build \
            -project AIKanji/AIKanji.xcodeproj \
            -scheme AIKanji \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
